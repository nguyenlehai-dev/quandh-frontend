server {
    listen 80;
    server_name yukimart.io.vn www.yukimart.io.vn localhost _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cache fingerprinted static assets aggressively.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Vue SPA fallback: direct access to routes like /apps/roles must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
