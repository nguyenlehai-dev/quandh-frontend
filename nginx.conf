# nginx.conf

server {
    listen 80;
    server_name localhost yukimart.io.vn www.yukimart.io.vn;
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Disable caching for index.html to ensure users always get the latest version
        if ($request_uri ~* ^/index\.html$|^/$) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    location /api/ {
        proxy_pass http://quandh-api:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /up {
        proxy_pass http://quandh-api:80/up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hide Cloudflare /cdn-cgi/rum 404 errors by returning success
    location /cdn-cgi/ {
        access_log off;
        return 204;
    }

    # Special handling for static assets to avoid MIME type errors
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Additional configurations go here...
}
